name: openclaw-enterprise-milestone-postgres

services:
  postgres:
    image: docker.io/library/postgres:18.6
    environment:
      POSTGRES_DB: openclaw_enterprise
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: openclaw-local-admin
    ports:
      - "127.0.0.1:${OCC_POSTGRES_PORT:-55432}:5432"
    volumes:
      - occ_postgres_data:/var/lib/postgresql
      - ./migrations/init-local.sql:/docker-entrypoint-initdb.d/00-occ-roles.sql:ro,Z
    healthcheck:
      # pg_isready answers during the entrypoint's initdb phase, before the
      # roles the migrate step needs exist; check for the role itself.
      test:
        [
          "CMD-SHELL",
          'psql -U postgres -d openclaw_enterprise -tAc "SELECT 1 FROM pg_roles WHERE rolname=''occ_migrator''" | grep -q 1',
        ]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  occ_postgres_data:
